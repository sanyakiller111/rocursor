[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sanyakiller111"
version = "1.7.0"
description = "Менеджер ресурсов Roblox: курсоры, небо, прицелы"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.6",
    "Pillow>=10",
    "requests>=2.31",
]

[project.scripts]
sanyakiller111 = "cursor_manager.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
